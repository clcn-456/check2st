<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- แก้ไขชื่อแท็บเบราว์เซอร์ตรงนี้ -->
    <title>ระบบเช็คชื่อ - ใส่ชื่อวิชาหรือชื่อที่ต้องการตรงนี้</title>
    
    <!-- โหลด Tailwind CSS สำหรับจัดการความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลด React สำหรับการทำงานของแอปพลิเคชัน -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- โหลด Babel สำหรับอ่านโค้ด JSX ในเบราว์เซอร์ -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- โหลด SheetJS สำหรับจัดการไฟล์ Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* สไตล์พื้นฐานและแอนิเมชันสำหรับ Web App */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-zoom-in { animation: zoomIn 0.2s ease-out forwards; }
        
        /* ซ่อน Scrollbar ของตารางแต่ยังเลื่อนได้ */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    
    <!-- จุดที่ React จะนำแอปพลิเคชันมาแสดงผล -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ฟังก์ชันสร้าง ID แบบสุ่ม
        const generateId = () => Math.random().toString(36).substring(2, 15);

        // ไอคอน SVG แบบ Inline 
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clipRule="evenodd" /></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clipRule="evenodd" /></svg>;
        const IconClipboard = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" /><path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" /></svg>;
        const IconWarning = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-14 w-14 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        const IconInfo = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-14 w-14 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" /></svg>;

        // กำหนดสถานะการเช็คชื่อตามรูปแบบใหม่ล่าสุด
        const ATTENDANCE_STATUS = {
          PRESENT: { value: 'มาเรียน', label: 'มาเรียน', symbol: '/', color: 'bg-green-100 text-green-800 border-green-200', btnColor: 'bg-green-500 hover:bg-green-600 text-white shadow-sm scale-105' },
          SICK_LEAVE: { value: 'ป่วย', label: 'ลาป่วย', symbol: 'ป', color: 'bg-blue-100 text-blue-800 border-blue-200', btnColor: 'bg-blue-500 hover:bg-blue-600 text-white shadow-sm scale-105' },
          PERSONAL_LEAVE: { value: 'ลากิจ', label: 'ลากิจ', symbol: 'ล', color: 'bg-purple-100 text-purple-800 border-purple-200', btnColor: 'bg-purple-500 hover:bg-purple-600 text-white shadow-sm scale-105' },
          ABSENT: { value: 'ขาดเรียน', label: 'ขาดเรียน', symbol: 'ข', color: 'bg-red-100 text-red-800 border-red-200', btnColor: 'bg-red-500 hover:bg-red-600 text-white shadow-sm scale-105' },
          UNMARKED: { value: '', label: 'ยังไม่เช็ค', symbol: '', color: 'bg-gray-50 text-gray-500 border-gray-200', btnColor: 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50' }
        };

        function App() {
          // States สำหรับเก็บข้อมูลหลัก
          const [students, setStudents] = useState([]);
          const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);
          const [attendanceData, setAttendanceData] = useState({});
          
          // States สำหรับ UI ควบคุมหน้าต่าง Pop-up
          const [isImportModalOpen, setIsImportModalOpen] = useState(false);
          const [pasteText, setPasteText] = useState('');
          
          // ระบบ Custom Dialog สำหรับแจ้งเตือนแบบสวยงาม (รองรับการใช้งานผ่านมือถือได้ดีกว่า alert ปกติ)
          const [dialog, setDialog] = useState({ 
              isOpen: false, type: 'info', title: '', message: '', 
              onConfirm: null, onCancel: null, confirmText: 'ตกลง', cancelText: 'ยกเลิก' 
          });

          const fileInputRef = useRef(null);

          // ฟังก์ชันเรียกหน้าต่างแจ้งเตือน
          const showAlert = (title, message) => {
              setDialog({ isOpen: true, type: 'info', title, message, onConfirm: () => setDialog(prev => ({...prev, isOpen: false})), onCancel: null, confirmText: 'ตกลง' });
          };
          
          const showConfirm = (title, message, onConfirm, onCancel = null, confirmText = 'ตกลง', cancelText = 'ยกเลิก') => {
              setDialog({ isOpen: true, type: 'warning', title, message, onConfirm, onCancel, confirmText, cancelText });
          };

          const closeDialog = () => setDialog(prev => ({ ...prev, isOpen: false }));

          // โหลดข้อมูลที่บันทึกไว้ในเบราว์เซอร์เมื่อเปิดหน้าเว็บ
          useEffect(() => {
            const savedStudents = localStorage.getItem('githubApp_students');
            const savedAttendance = localStorage.getItem('githubApp_attendanceData');
            
            if (savedStudents) {
              try { setStudents(JSON.parse(savedStudents)); } catch (e) { console.error("Error loading students", e); }
            }
            if (savedAttendance) {
              try { setAttendanceData(JSON.parse(savedAttendance)); } catch (e) { console.error("Error loading attendance", e); }
            }
          }, []);

          // บันทึกข้อมูลลงเบราว์เซอร์อัตโนมัติทุกครั้งที่มีการเปลี่ยนแปลง
          useEffect(() => {
            localStorage.setItem('githubApp_students', JSON.stringify(students));
          }, [students]);

          useEffect(() => {
            localStorage.setItem('githubApp_attendanceData', JSON.stringify(attendanceData));
          }, [attendanceData]);

          // จัดการเมื่อเลือกอัปโหลดไฟล์ Excel
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
              if (!window.XLSX) {
                  showAlert("เกิดข้อผิดพลาด", "กำลังโหลดระบบอ่านไฟล์ กรุณารอสักครู่แล้วลองใหม่ครับ");
                  return;
              }
              const bstr = evt.target.result;
              const wb = window.XLSX.read(bstr, { type: 'binary' });
              const wsname = wb.SheetNames[0];
              const ws = wb.Sheets[wsname];
              const data = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
              
              processImportedData(data);
            };
            reader.readAsBinaryString(file);
            setIsImportModalOpen(false);
            if (fileInputRef.current) fileInputRef.current.value = '';
          };

          // จัดการเมื่อนำเข้าข้อมูลจากการวาง (Paste) text
          const handlePasteSubmit = () => {
            if (!pasteText.trim()) return;
            // แยกแถวด้วยขึ้นบรรทัดใหม่ และแยกคอลัมน์ด้วย Tab
            const rows = pasteText.split('\n').map(row => row.split('\t')); 
            processImportedData(rows);
            setPasteText('');
            setIsImportModalOpen(false);
          };

          const processImportedData = (data) => {
            let newStudents = [];
            // กรองเอาเฉพาะแถวที่มีข้อมูล
            const validRows = data.filter(row => row && row.length > 0 && row.some(cell => cell !== null && cell !== undefined && String(cell).trim() !== ''));

            // ตรวจสอบ Header
            let startIndex = 0;
            if (validRows.length > 0) {
              const firstRowStr = validRows[0].join(' ').toLowerCase();
              if (firstRowStr.includes('ชื่อ') || firstRowStr.includes('name') || firstRowStr.includes('รหัส') || firstRowStr.includes('id') || firstRowStr.includes('เลขที่')) {
                startIndex = 1;
              }
            }

            for (let i = startIndex; i < validRows.length; i++) {
              const row = validRows[i];
              let student = { id: generateId() };

              if (row.length === 1) {
                student.name = String(row[0]).trim();
                student.studentId = String(i).padStart(2, '0');
              } else if (row.length >= 2) {
                const col0 = String(row[0]).trim();
                const col1 = String(row[1]).trim();
                
                if (row.length >= 3 && /^\d+$/.test(col0) && col0.length < 4) {
                     student.studentId = col0;
                     student.name = String(row[2]).trim();
                     if (row.length >= 4 && String(row[3]).trim()) {
                         student.name += ' ' + String(row[3]).trim();
                     }
                } else {
                    student.studentId = col0;
                    student.name = col1;
                }
              }
              
              if (student.name && student.name !== 'undefined') {
                newStudents.push(student);
              }
            }

            if (newStudents.length > 0) {
                showConfirm(
                    "พบข้อมูลนักเรียน",
                    `ระบบดึงรายชื่อนักเรียนได้สำเร็จจำนวน ${newStudents.length} คน คุณต้องการแทนที่รายชื่อชุดเดิม หรือต้องการนำไปต่อท้ายรายชื่อเดิมครับ?`,
                    () => {
                        setStudents(newStudents); // แทนที่
                        closeDialog();
                    },
                    () => {
                        setStudents([...students, ...newStudents]); // ต่อท้าย
                        closeDialog();
                    },
                    "แทนที่ทั้งหมด",
                    "เพิ่มต่อท้าย"
                );
            } else {
                showAlert("ไม่พบข้อมูล", "ไม่พบรายชื่อในไฟล์ที่คุณนำเข้า โปรดตรวจสอบรูปแบบข้อมูลอีกครั้งครับ");
            }
          };

          // ฟังก์ชันบันทึกการเช็คชื่อ
          const markAttendance = (studentId, statusKey) => {
            setAttendanceData(prev => {
              const dateData = prev[currentDate] || {};
              return { ...prev, [currentDate]: { ...dateData, [studentId]: statusKey } };
            });
          };

          // เช็คชื่อทุกคนที่ยังไม่ได้เช็คให้กลายเป็นสถานะที่เลือก
          const markAllUnmarkedAs = (statusKey) => {
              setAttendanceData(prev => {
                  const dateData = prev[currentDate] || {};
                  const newDateData = { ...dateData };
                  students.forEach(student => {
                     if(!newDateData[student.id]) newDateData[student.id] = statusKey;
                  });
                  return { ...prev, [currentDate]: newDateData };
              })
          }

          // ลบนักเรียนออกจากระบบ
          const deleteStudent = (id) => {
              showConfirm("ยืนยันการลบ", "ต้องการลบรายชื่อนักเรียนคนนี้ออกจากระบบใช่หรือไม่?", () => {
                  setStudents(students.filter(s => s.id !== id));
                  closeDialog();
              });
          }

          // ล้างข้อมูลการใช้งานแอปพลิเคชันทั้งหมด
          const clearAllData = () => {
              showConfirm("คำเตือน!", "ต้องการล้างรายชื่อและประวัติการเช็คชื่อทั้งหมดหรือไม่? ข้อมูลนี้ไม่สามารถกู้คืนได้หาไม่ได้ดาวน์โหลด Excel ไว้", () => {
                  setStudents([]);
                  setAttendanceData({});
                  localStorage.removeItem('githubApp_students');
                  localStorage.removeItem('githubApp_attendanceData');
                  closeDialog();
              }, () => closeDialog(), "ล้างข้อมูลทั้งหมด", "ยกเลิก");
          }

          // ส่งออกข้อมูลในรูปแบบ Excel ตามภาพต้นแบบเป๊ะๆ
          const exportToExcel = () => {
            if (students.length === 0) {
              showAlert("ไม่พบข้อมูล", "กรุณานำเข้ารายชื่อนักเรียนก่อนทำการดาวน์โหลดครับ");
              return;
            }

            const todayRecord = attendanceData[currentDate] || {};
            
            // แปลงวันที่สำหรับใช้เป็นส่วนหัว (เช่น วันที่ 18 สิงหาคม 2569)
            const dateObj = new Date(currentDate);
            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const day = dateObj.getDate();
            const month = thaiMonths[dateObj.getMonth()];
            const year = dateObj.getFullYear() + 543;
            const dateStr = `วันที่ ${day} ${month} ${year}`;

            // โครงสร้าง Header แบบใหม่: เลขที่, ชื่อ, มาเรียน, ลาป่วย, ลากิจ, ขาด, สถานะ
            const headerRow1 = [`ข้อมูลการเช็คชื่อ${dateStr}`]; // ชิดติดกันตามภาพ
            const headers = ['เลขที่', 'ชื่อ-นามสกุล', 'มาเรียน', 'ลาป่วย', 'ลากิจ', 'ขาด', 'สถานะการมาเรียน'];

            const exportData = [ headerRow1, headers ];
            
            // ตัวแปรนับสรุปจำนวน
            let summary = { PRESENT: 0, SICK_LEAVE: 0, PERSONAL_LEAVE: 0, ABSENT: 0, UNMARKED: 0 };

            // การใส่ข้อมูลแต่ละแถว
            students.forEach((student, index) => {
              const statusKey = todayRecord[student.id];
              const statusObj = statusKey ? ATTENDANCE_STATUS[statusKey] : ATTENDANCE_STATUS.UNMARKED;
              
              if(statusKey) summary[statusKey]++;
              else summary.UNMARKED++;

              // เช็คเงื่อนไขใส่สัญลักษณ์ /, ป, ล, ข ในช่องที่ถูกต้อง
              exportData.push([
                student.studentId || (index + 1),
                student.name,
                statusKey === 'PRESENT' ? ATTENDANCE_STATUS.PRESENT.symbol : '',
                statusKey === 'SICK_LEAVE' ? ATTENDANCE_STATUS.SICK_LEAVE.symbol : '',
                statusKey === 'PERSONAL_LEAVE' ? ATTENDANCE_STATUS.PERSONAL_LEAVE.symbol : '',
                statusKey === 'ABSENT' ? ATTENDANCE_STATUS.ABSENT.symbol : '',
                statusKey ? statusObj.value : '' // ป่วย, ขาดเรียน ฯลฯ
              ]);
            });

            // เพิ่มบรรทัดว่าง 2 บรรทัด
            exportData.push([]); exportData.push([]);
            
            // ตารางสรุปผลด้านล่างของไฟล์ Excel (ต้องเป๊ะตามภาพ)
            exportData.push(['', '', 'สรุปการมาเรียน']);
            exportData.push(['', '', 'มาเรียน', summary.PRESENT, 'คน']);
            exportData.push(['', '', 'มาสาย', 0, 'คน']); // ภาพล่าสุดมีคำว่า มาสาย เป็น 0 คน
            exportData.push(['', '', 'ลาป่วย', summary.SICK_LEAVE, 'คน']);
            exportData.push(['', '', 'ลากิจ', summary.PERSONAL_LEAVE, 'คน']);
            exportData.push(['', '', 'ขาด', summary.ABSENT, 'คน']);
            exportData.push(['', '', 'ยังไม่เช็ค', summary.UNMARKED, 'คน']);
            exportData.push(['', '', 'รวมทั้งหมด', students.length, 'คน']);

            if (!window.XLSX) {
                showAlert("ระบบกำลังทำงาน", "ไลบรารีสำหรับการสร้าง Excel กำลังโหลด กรุณารอสักครู่ครับ");
                return;
            }

            // นำข้อมูลไปสร้างเป็น Worksheet
            const wb = window.XLSX.utils.book_new();
            const ws = window.XLSX.utils.aoa_to_sheet(exportData);

            // ตั้งค่าความกว้างคอลัมน์ให้อ่านง่าย
            ws['!cols'] = [
                { wch: 8 },  // เลขที่
                { wch: 35 }, // ชื่อ-นามสกุล
                { wch: 10 }, // มาเรียน
                { wch: 10 }, // ลาป่วย
                { wch: 10 }, // ลากิจ
                { wch: 10 }, // ขาด
                { wch: 18 }  // สถานะการมาเรียน
            ];
            
            // ผสานเซลล์สำหรับแถวบนสุด (Header 1)
            if(!ws['!merges']) ws['!merges'] = [];
            ws['!merges'].push({ s: {r:0, c:0}, e: {r:0, c:6} }); // ผสาน A1 ถึง G1

            window.XLSX.utils.book_append_sheet(wb, ws, "Attendance");
            window.XLSX.writeFile(wb, `เช็คชื่อ_${currentDate}.xlsx`);
          };

          return (
            <div className="font-sans w-full min-h-screen pb-12 flex flex-col">
              
              {/* Header Navigation */}
              <header className="bg-indigo-700 text-white shadow-lg sticky top-0 z-30">
                <div className="max-w-6xl mx-auto px-4 py-4 sm:py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div className="text-center sm:text-left">
                    <h1 className="text-xl sm:text-2xl font-bold tracking-tight flex items-center gap-2 justify-center sm:justify-start">
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-indigo-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        {/* แก้ไขชื่อหัวเว็บ (Header) ตรงนี้ */}
                        ระบบเช็คชื่อ - ใส่ชื่อที่ต้องการตรงนี้
                    </h1>
                  </div>
                  <button 
                      onClick={() => setIsImportModalOpen(true)}
                      className="w-full sm:w-auto bg-white/20 hover:bg-white/30 backdrop-blur text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center justify-center gap-2 shadow-sm border border-white/10"
                  >
                    <IconUpload />
                    <span>นำเข้ารายชื่อ</span>
                  </button>
                </div>
              </header>

              <main className="max-w-6xl mx-auto w-full px-4 py-6 flex-grow flex flex-col lg:flex-row gap-6">
                
                {/* 🔴 โซนควบคุมซ้ายมือ (Sidebar) */}
                <div className="w-full lg:w-[30%] flex flex-col gap-5">
                  
                  {/* กล่องเลือกวันที่ */}
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60">
                    <h2 className="text-sm font-bold uppercase tracking-wider mb-3 text-slate-500 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        วันที่เช็คชื่อ
                    </h2>
                    <input 
                      type="date" 
                      value={currentDate}
                      onChange={(e) => setCurrentDate(e.target.value)}
                      className="w-full bg-slate-50 border-slate-200 rounded-xl shadow-inner focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 p-3 border text-base font-medium outline-none transition-all"
                    />
                  </div>

                  {/* กล่องควบคุมและจัดการ */}
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60 flex flex-col gap-3">
                     <button 
                        onClick={() => markAllUnmarkedAs('PRESENT')}
                        className="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-3 rounded-xl font-medium transition-all text-sm flex items-center justify-center gap-2"
                     >
                         <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>
                         ให้คนยังไม่เช็ค "มาเรียน"
                     </button>
                     <button 
                        onClick={exportToExcel}
                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-medium shadow transition-all flex justify-center items-center gap-2 mt-1 text-sm"
                     >
                         <IconDownload />
                         ดาวน์โหลด Excel
                     </button>
                     
                     <div className="h-px bg-slate-100 my-2"></div>
                     
                     <button 
                        onClick={clearAllData}
                        className="w-full text-slate-400 hover:text-red-500 hover:bg-red-50 py-2.5 rounded-xl text-sm font-medium transition-all"
                     >
                         ล้างข้อมูลทั้งหมดในระบบ
                     </button>
                  </div>

                  {/* กล่องสรุปจำนวน */}
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60">
                      <h2 className="text-sm font-bold uppercase tracking-wider mb-4 text-slate-500">สรุปยอดวันนี้</h2>
                      {(() => {
                          const todayData = attendanceData[currentDate] || {};
                          let counts = { PRESENT: 0, SICK_LEAVE: 0, PERSONAL_LEAVE: 0, ABSENT: 0, UNMARKED: 0 };
                          students.forEach(s => {
                              const status = todayData[s.id];
                              if(status) counts[status]++;
                              else counts.UNMARKED++;
                          });

                          return (
                              <div className="grid grid-cols-2 gap-3 text-sm">
                                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex flex-col items-center"><span className="text-slate-500 text-xs">ทั้งหมด</span><span className="font-bold text-xl text-slate-700">{students.length}</span></div>
                                  <div className="bg-gray-100 p-3 rounded-xl border border-gray-200 flex flex-col items-center"><span className="text-gray-500 text-xs">ยังไม่เช็ค</span><span className="font-bold text-xl text-gray-700">{counts.UNMARKED}</span></div>
                                  <div className="bg-emerald-50 text-emerald-700 p-3 rounded-xl border border-emerald-100 flex flex-col items-center"><span className="text-xs">มาเรียน</span><span className="font-bold text-xl">{counts.PRESENT}</span></div>
                                  <div className="bg-rose-50 text-rose-700 p-3 rounded-xl border border-rose-100 flex flex-col items-center"><span className="text-xs">ขาดเรียน</span><span className="font-bold text-xl">{counts.ABSENT}</span></div>
                                  <div className="bg-sky-50 text-sky-700 p-3 rounded-xl border border-sky-100 flex flex-col items-center"><span className="text-xs">ป่วย</span><span className="font-bold text-xl">{counts.SICK_LEAVE}</span></div>
                                  <div className="bg-purple-50 text-purple-700 p-3 rounded-xl border border-purple-100 flex flex-col items-center"><span className="text-xs">ลากิจ</span><span className="font-bold text-xl">{counts.PERSONAL_LEAVE}</span></div>
                              </div>
                          );
                      })()}
                  </div>
                </div>

                {/* 🔴 โซนตารางนักเรียน (Main Content) */}
                <div className="w-full lg:w-[70%]">
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden flex flex-col h-full">
                    <div className="bg-slate-50/80 border-b border-slate-200/60 px-5 py-4 flex justify-between items-center">
                        <h2 className="text-base font-bold text-slate-800">รายชื่อนักเรียน <span className="bg-indigo-100 text-indigo-700 py-0.5 px-2 rounded-full text-xs ml-2">{students.length}</span></h2>
                    </div>

                    {students.length === 0 ? (
                        // หน้าจอตอนยังไม่มีนักเรียน
                        <div className="p-10 flex-grow flex flex-col items-center justify-center text-center bg-slate-50/30">
                            <div className="bg-indigo-50 p-5 rounded-full text-indigo-500 mb-4 shadow-sm border border-indigo-100">
                                <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                            </div>
                            <h3 className="text-lg font-bold text-slate-700 mb-2">ยังไม่มีรายชื่อนักเรียน</h3>
                            <p className="text-slate-500 mb-6 text-sm max-w-sm">เริ่มต้นการเช็คชื่อโดยนำเข้าไฟล์ Excel (.xlsx) หรือก๊อปปี้รายชื่อมาวางในระบบได้เลยครับ</p>
                            <button 
                                onClick={() => setIsImportModalOpen(true)}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl text-sm font-medium shadow transition-all flex items-center gap-2"
                            >
                                <IconUpload />
                                นำเข้ารายชื่อนักเรียน
                            </button>
                        </div>
                    ) : (
                        <div className="overflow-x-auto hide-scrollbar">
                            <table className="w-full text-left border-collapse min-w-[550px]">
                                <thead>
                                    <tr className="bg-white text-slate-400 text-xs uppercase tracking-widest border-b border-slate-100">
                                        <th className="px-4 py-4 font-bold w-12 text-center">#</th>
                                        <th className="px-5 py-4 font-bold">ข้อมูลนักเรียน</th>
                                        <th className="px-3 py-4 font-bold text-center">สถานะการเข้าเรียน</th>
                                        <th className="px-4 py-4 font-bold text-center w-12"></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {students.map((student, index) => {
                                        const todayData = attendanceData[currentDate] || {};
                                        const currentStatusKey = todayData[student.id];

                                        return (
                                            <tr key={student.id} className="hover:bg-slate-50 transition-colors group">
                                                <td className="px-4 py-4 text-center text-slate-400 text-sm font-mono">{student.studentId || index + 1}</td>
                                                <td className="px-5 py-4">
                                                    <div className="font-bold text-slate-800 text-base">{student.name}</div>
                                                </td>
                                                
                                                <td className="px-3 py-4">
                                                    <div className="flex flex-wrap justify-center gap-1.5 sm:gap-2">
                                                        {Object.entries(ATTENDANCE_STATUS).filter(([key]) => key !== 'UNMARKED').map(([key, val]) => (
                                                            <button
                                                                key={key}
                                                                onClick={() => markAttendance(student.id, key)}
                                                                className={`px-3 py-1.5 rounded-lg text-[13px] sm:text-sm font-medium transition-all duration-200 border
                                                                    ${currentStatusKey === key 
                                                                        ? val.btnColor + ' border-transparent' 
                                                                        : 'bg-white text-slate-500 border-slate-200 hover:border-slate-300 hover:bg-slate-100 hover:text-slate-800'
                                                                    }
                                                                `}
                                                            >
                                                                {val.label}
                                                            </button>
                                                        ))}
                                                        {currentStatusKey && (
                                                            <button onClick={() => markAttendance(student.id, null)} className="px-2 text-xs text-slate-400 hover:text-slate-600 transition-colors" title="ล้างค่า">
                                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                            </button>
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="px-4 py-4 text-center">
                                                    <button onClick={() => deleteStudent(student.id)} className="text-slate-200 hover:text-rose-500 bg-white hover:bg-rose-50 p-2 rounded-lg transition-all opacity-0 group-hover:opacity-100" title="ลบรายชื่อ">
                                                        <IconTrash />
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}
                  </div>
                </div>
              </main>

              {/* โมดอลนำเข้าข้อมูล (Import Modal) */}
              {isImportModalOpen && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 flex items-center justify-center p-4 animate-fade-in">
                  <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden animate-zoom-in">
                    <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                        <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <span className="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg"><IconUpload /></span>
                            นำเข้ารายชื่อนักเรียน
                        </h3>
                        <button onClick={() => setIsImportModalOpen(false)} className="text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 p-1.5 rounded-full transition-colors">
                            <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    
                    <div className="p-6 bg-slate-50/50">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            {/* แบบอัปโหลดไฟล์ */}
                            <div className="border border-slate-200 rounded-2xl p-6 bg-white flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md transition-shadow">
                                <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-3">
                                    <IconUpload />
                                </div>
                                <h4 className="font-bold text-slate-800 text-base mb-1">อัปโหลดไฟล์ Excel</h4>
                                <p className="text-xs text-slate-500 mb-4 leading-relaxed">รองรับไฟล์ .xlsx, .xls<br/>(แนะนำให้มีคอลัมน์ เลขที่ และ ชื่อ)</p>
                                <input type="file" accept=".xlsx, .xls" className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
                                <button onClick={() => fileInputRef.current.click()} className="bg-white border border-slate-300 hover:border-emerald-400 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition-all w-full">
                                    เลือกไฟล์จากเครื่อง
                                </button>
                            </div>

                            {/* แบบวางข้อความ */}
                            <div className="border border-slate-200 rounded-2xl p-6 bg-white flex flex-col shadow-sm hover:shadow-md transition-shadow">
                                 <div className="flex items-center gap-3 mb-2">
                                    <div className="w-10 h-10 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center">
                                        <IconClipboard />
                                    </div>
                                    <h4 className="font-bold text-slate-800 text-base">วางรายชื่อ (Paste)</h4>
                                 </div>
                                 <p className="text-xs text-slate-500 mb-3 leading-relaxed">ก๊อปปี้จากตาราง Word/Excel มาวาง<br/>(ข้อมูล 1 คน ต่อ 1 บรรทัด)</p>
                                 <textarea 
                                    value={pasteText} 
                                    onChange={(e) => setPasteText(e.target.value)} 
                                    className="w-full h-24 border-slate-200 bg-slate-50 rounded-xl text-xs p-3 focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 focus:bg-white mb-3 outline-none transition-all resize-none" 
                                    placeholder="ตัวอย่าง:&#10;1 เด็กชายสมชาย ใจดี&#10;2 เด็กหญิงสมหญิง รักเรียน"
                                 ></textarea>
                                 <button 
                                    onClick={handlePasteSubmit} 
                                    disabled={!pasteText.trim()} 
                                    className="w-full bg-sky-600 hover:bg-sky-700 disabled:bg-slate-200 disabled:text-slate-400 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition-all"
                                 >
                                     เพิ่มรายชื่อ
                                 </button>
                            </div>
                        </div>
                    </div>
                  </div>
                </div>
              )}

              {/* โมดอลแจ้งเตือน (Custom Dialog Alert) */}
              {dialog.isOpen && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                  <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-zoom-in text-center p-8">
                    <div className="flex justify-center mb-5">
                        {dialog.type === 'warning' ? <IconWarning /> : <IconInfo />}
                    </div>
                    <h3 className="text-2xl font-bold text-slate-800 mb-3">{dialog.title}</h3>
                    <p className="text-slate-500 mb-8 text-sm leading-relaxed">{dialog.message}</p>
                    
                    <div className="flex justify-center gap-3">
                        {dialog.onCancel && (
                            <button 
                                onClick={dialog.onCancel}
                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-6 py-3 rounded-xl text-sm font-bold transition-colors w-full"
                            >
                                {dialog.cancelText}
                            </button>
                        )}
                        <button 
                            onClick={dialog.onConfirm}
                            className={`${dialog.type === 'warning' && !dialog.onCancel ? 'bg-indigo-600 hover:bg-indigo-700' : (dialog.type === 'warning' ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700')} text-white px-6 py-3 rounded-xl text-sm font-bold transition-colors shadow-md w-full`}
                        >
                            {dialog.confirmText}
                        </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
